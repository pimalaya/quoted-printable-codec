[package]
name = "quoted-printable-codec"
description = "Quoted-printable encoder and decoder with SIMD and no_std"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["encoding", "no-std", "no-std::no-alloc", "email"]
keywords = ["quoted-printable", "mime", "codec", "no-std", "email"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/quoted-printable-codec/latest/quoted_printable_codec"
repository = "https://github.com/pimalaya/quoted-printable-codec"
exclude = ["/cairn"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
alloc = []

[[bench]]
name = "compare"
path = "benches/compare.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
encodify = { version = "1", default-features = false }
mail-parser = { version = "0.11", default-features = false }
quoted_printable = { version = "0.5", default-features = false, features = ["std"] }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }

[dependencies]
simd-cpu = { version = "0.1", default-features = false }
