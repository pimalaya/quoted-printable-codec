name: Tests

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  aarch64:
    name: test (aarch64, NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  miri:
    name: miri (portable and AVX2 kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri test --lib
      - run: cargo miri test --lib
        env:
          RUSTFLAGS: -C target-feature=+avx2,+bmi1,+lzcnt,+popcnt

  # NOTE: on an arm runner rather than with `--target` from x86, whose
  # runner has no aarch64 C compiler for the build scripts of the
  # dev-dependencies (criterion's alloca).
  miri-aarch64:
    name: miri (NEON kernels)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri test --lib

  fuzz:
    name: fuzz (short runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Loosen ASan shadow-memory ASLR for the libFuzzer runner
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cargo fuzz run decode -- -runs=200000
      - run: cargo fuzz run encode -- -runs=200000
